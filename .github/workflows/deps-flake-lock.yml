# Relock flake.lock — the single writer of this repo's lock file
#
# The shared workflow runs a bare `nix flake update`, so every root input moves
# together and lands in ONE pull request on the branch `chore/flake-lock`.
#
# This replaced deps-refresh-nixpkgs.yml on 2026-08-05, which refreshed exactly
# one input per call. Measured 2026-07-28, this repo's lock was 65 days stale
# with Renovate running the whole time.
#
# Renovate does not and cannot do this job. It advances an input when the
# input's REFERENCE changes, and the nixpkgs pin here is a moving channel branch
# whose reference never changes. Its `nix` manager is disabled org-wide
# (renovate-nix.json) so this workflow stays the only writer of flake.lock.
# The hourly run is a seconds-long check that relocks only our inputs behind their branch head.
name: Update flake.lock

on:
  schedule:
    # Thursday 18:00 UTC. GitHub Actions cron is always UTC. The minute differs
    # per repo so the six nix repos do not all fire in the same instant.
    # Weekly: relock the whole flake (third-party inputs included).
    - cron: "43 18 * * 4"
    # Hourly: a seconds-long check that relocks only our inputs behind their branch head.
    - cron: "19 * * * *"
  repository_dispatch:
    types: [update-flake-input]
  workflow_dispatch: {}

permissions: {}

jobs:
  relock:
    uses: dryvist/.github/.github/workflows/_update-flake-lock.yml@26e28bf87868d0c71119bf8ce914325dbd468cdc # v1.11.0
    with:
      targeted: ${{ github.event_name == 'repository_dispatch' || github.event.schedule == '19 * * * *' }}
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
