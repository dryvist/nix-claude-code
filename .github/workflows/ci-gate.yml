# CI Gate — thin wrapper over the dryvist org reusable workflow
#
# Delegates the standard checks to the org orchestrator
# `dryvist/.github/.github/workflows/_ci-gate.yml@main`; its `Merge Gate`
# summary job always reports, making it safe to require in rulesets.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant,
      # so `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    # The `nix` filter is load-bearing, not decorative. `Nix Validate` is
    # gated on BOTH `nix_validate` and `needs.changes.outputs.nix == 'true'`,
    # and `File Size` is gated on the `nix` OR `markdown` filter. Without a
    # `nix:` key here, a PR touching only `.nix` files silently skips both —
    # so Nix could reach `develop` never having been evaluated, formatted, or
    # lib-tested. `ci.yml` does not cover the gap: it fires only on `main`.
    with:
      markdown_lint: true
      file_size: true
      nix_validate: true
      # treefmt/pre-commit checks are platform-specific; restrict to the
      # runner's system (x86_64-linux), matching ci.yml. The org default is
      # `true`, which would newly evaluate darwin systems on every PR.
      all_systems: false
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
        nix:
          - '**.nix'
          - 'flake.lock'
          # Not just `.nix`: the Nix checks evaluate and run non-Nix files
          # too. `flake/checks/` builds fixture-driven regression tests from
          # the data under `flake/checks/tests/`, and several of them execute
          # scripts from `modules/scripts/`. Those checks are the only
          # coverage those files have, so leaving them out of this filter
          # skips the entire Nix gate on exactly the PRs that change the
          # behaviour under test — a shell-script fix ships with its own new
          # regression tests never having run. Same failure shape as the
          # missing `nix:` key described above, one layer further out.
          - 'modules/scripts/**'
          - 'flake/checks/tests/**'
