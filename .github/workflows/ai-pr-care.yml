# AI PR care: dependency risk review.
#
# cc-dep-review posts one AI risk-assessment comment on Renovate major/minor
# PRs. This repo has no release-please, so the release-notes job is omitted.
#
# Permissions are job-scoped and credentials are passed explicitly (zizmor:
# excessive-permissions, secrets-inherit). No concurrency block on purpose: a
# caller sharing the reusable workflow's exact concurrency group causes an
# opaque 0-job startup_failure.

name: AI PR Care

on:
  pull_request:
    types: [opened]

jobs:
  dep-review:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/cc-dep-review.yml@e77c7f08b2f33f5dd3e1dff25c65056892ece445 # v0.48.2
    secrets: inherit
