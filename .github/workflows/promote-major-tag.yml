---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@6d4a39e4006e374803b7a0794148575b8bfc9be1 # v1.14.0
    with:
      tag: ${{ github.event.release.tag_name }}
